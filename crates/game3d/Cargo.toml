[package]
name = "game3d"
description = "Econoplex: 3D view (graphics/UI subproject) and the shader playground"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "econoplex3d"
path = "src/main.rs"

[features]
# Frame profiling (docs/profiling.md). `profile` records a span for every
# system, render-graph node and simulation tick into a Chrome trace file
# (open it in ui.perfetto.dev, or summarize it with tools/profile/analyze.py);
# `profile-tracy` streams the same spans to the Tracy profiler instead.
profile = ["bevy/trace_chrome"]
profile-tracy = ["bevy/trace_tracy"]

[dependencies]
sim_core.workspace = true
sim_data.workspace = true
# `file_watcher` reloads shaders (assets/shaders/*.wesl) while the app runs.
bevy = { workspace = true, features = [
    "3d",
    "std",
    "multi_threaded",
    "bevy_winit",
    "default_font",
    "ui_api",
    "ui_bevy_render",
    "png",
    "file_watcher",
] }

# Linux needs a windowing backend feature; Windows and macOS use their native one.
# Data panels (economy, policy, events): immediate-mode UI (graphics-ui.md, M5).
bevy_egui = { version = "0.43.1", default-features = false, features = ["render", "default_fonts"] }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { workspace = true, features = ["x11"] }
